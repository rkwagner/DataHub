version: '3'

services:
  # S3 Compatible Storage
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: datahub-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Metadata Database for Hive Metastore
  postgres:
    image: postgres:13
    container_name: datahub-postgres
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepassword
      POSTGRES_DB: metastore
    ports:
      - "5432:5432"

  # Hive Metastore
  hive-metastore:
    image: apache/hive:4.0.0-alpha-2
    container_name: datahub-hms
    depends_on:
      - postgres
      - minio
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: "-Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore -Djavax.jdo.option.ConnectionUserName=hive -Djavax.jdo.option.ConnectionPassword=hivepassword -Dfs.s3a.access.key=minio -Dfs.s3a.secret.key=minio123 -Dfs.s3a.endpoint=http://minio:9000 -Dfs.s3a.path.style.access=true -Dfs.s3a.connection.ssl.enabled=false"
    ports:
      - "9083:9083"
    command: /opt/hive/bin/hive --service metastore

  # Trino
  trino:
    image: trinodb/trino:436
    container_name: datahub-trino
    ports:
      - "8080:8080"
    volumes:
      - ./config/trino/catalog:/etc/trino/catalog
    depends_on:
      - hive-metastore
      - minio
