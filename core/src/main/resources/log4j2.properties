# --- log4j2.properties ---

# 1. Configuration Name and Root Level
# Setting the root level to WARN or INFO is common for production.
# Use DEBUG or TRACE for development and troubleshooting.
name=DataHubLogConfig
status=warn

# 2. Define Appenders (Where the logs go)
# Console appender is standard for containers and tests.
appender.console.type=Console
appender.console.name=Console
appender.console.layout.type=PatternLayout
# Define the format of the log message: [LEVEL] [Thread Name] [Logger Name] - Message
appender.console.layout.pattern=%d{HH:mm:ss.SSS} [%t] %-5level %c{1.} - %msg%n

# 3. Define Loggers (Specific log levels for certain packages)

# Set high-volume packages to WARN or ERROR to suppress noise
# These are crucial for Spark/Hudi/Trino projects:
logger.hudi.name=org.apache.hudi
logger.hudi.level=WARN

logger.spark.name=org.apache.spark
logger.spark.level=WARN

logger.parquet.name=org.apache.parquet
logger.parquet.level=WARN

# 4. Define the Root Logger (Fallback for all other packages)
rootLogger.level=INFO
rootLogger.appenderRef.stdout.ref=Console

# Additional option: To see the output of YOUR project's code specifically:
# logger.datahub.name=datahub
# logger.datahub.level=INFO