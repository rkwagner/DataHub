name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  checkstyle:
    name: Code Quality (Checkstyle)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Run Checkstyle
      run: |
        echo "🔍 Running Checkstyle checks in parallel..."
        ./gradlew checkstyleMain checkstyleTest --parallel --build-cache

  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Verify and start MinIO
      run: |
        echo "🔍 Verifying MinIO Docker image availability..."
        if ! docker pull minio/minio:latest; then
          echo "❌ ERROR: Failed to pull MinIO Docker image 'minio/minio:latest'"
          echo "This could be due to:"
          echo "  - Docker Hub rate limiting"
          echo "  - Network connectivity issues"
          echo "  - Invalid image name or tag"
          echo ""
          echo "Please check:"
          echo "  1. Docker Hub status: https://status.docker.com/"
          echo "  2. Image exists: https://hub.docker.com/r/minio/minio"
          echo "  3. GitHub Actions Docker pull limits"
          exit 1
        fi
        echo "✅ MinIO image pulled successfully"
        
        echo "🚀 Starting MinIO server..."
        docker run -d \
          --name minio-ci \
          -p 9000:9000 \
          -e "MINIO_ROOT_USER=minio" \
          -e "MINIO_ROOT_PASSWORD=minio123" \
          minio/minio \
          server /data --address ":9000"
        
        echo "⏳ Waiting for MinIO to be ready..."
        RETRIES=30
        COUNT=0
        until curl -f http://localhost:9000/minio/health/live 2>/dev/null; do
          COUNT=$((COUNT+1))
          if [ $COUNT -ge $RETRIES ]; then
            echo "❌ ERROR: MinIO failed to start after $RETRIES attempts"
            echo "Container logs:"
            docker logs minio-ci
            exit 1
          fi
          echo "Attempt $COUNT/$RETRIES - MinIO not ready yet, waiting..."
          sleep 2
        done
        echo "✅ MinIO is ready!"
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Create MinIO bucket
      run: |
        echo "📦 Setting up MinIO bucket..."
        # Install MinIO client
        wget -q https://dl.min.io/client/mc/release/linux-amd64/mc
        chmod +x mc
        
        # Configure MinIO client
        if ! ./mc alias set myminio http://localhost:9000 minio minio123; then
          echo "❌ ERROR: Failed to configure MinIO client"
          echo "MinIO may not be responding correctly"
          docker logs minio-ci
          exit 1
        fi
        
        # Create bucket
        if ! ./mc mb myminio/hudi-data --ignore-existing; then
          echo "⚠️  WARNING: Failed to create bucket, but continuing..."
          echo "Bucket may already exist or MinIO may have permission issues"
        else
          echo "✅ MinIO bucket 'hudi-data' created successfully"
        fi
        
        # Verify bucket exists
        ./mc ls myminio/ | grep hudi-data && echo "✅ Bucket verified" || echo "⚠️  Bucket not found in listing"
    
    - name: Build with Gradle
      run: |
        echo "🏗️  Building project with Gradle..."
        ./gradlew build jacocoRootReport --continue
      env:
        CI: true
        MINIO_ENDPOINT: http://localhost:9000
        MINIO_ACCESS_KEY: minio
        MINIO_SECRET_KEY: minio123
    
    - name: Upload Coverage Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build/reports/jacoco/jacocoRootReport/html/**
        retention-days: 14

    - name: Code Coverage Summary
      if: always()
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
        badge: true
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '60 80'

    - name: Add Coverage to Job Summary
      if: always()
      run: |
        if [ -f code-coverage-results.md ]; then
          cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Code coverage report not found." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request' && hashFiles('code-coverage-results.md') != ''
      with:
        recreate: true
        path: code-coverage-results.md

    - name: Stop MinIO
      if: always()
      run: |
        echo "🛑 Stopping MinIO container..."
        docker stop minio-ci || true
        docker rm minio-ci || true
    
    - name: Test Summary
      if: always()
      run: |
        echo "📊 Test Summary:"
        echo "==============="
        find . -name "TEST-*.xml" -type f | head -5 | while read file; do
          echo "Found: $file"
        done || echo "No test results found"
