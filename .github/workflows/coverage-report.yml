name: Coverage Reporting

on:
  workflow_run:
    workflows: ["Java CI with Gradle"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  report-coverage:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: coverage-xml-reports
          path: coverage-reports

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Coverage Summary
        run: |
          python .github/scripts/generate_coverage_summary.py coverage-reports

      - name: Find Pull Request
        uses: actions/github-script@v7
        id: find-pr
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: context.payload.workflow_run.id,
            });
            
            // We can't easily find the PR from workflow_run unless we query for PRs associated with the commit
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.workflow_run.head_sha,
            });
            
            if (prs.data.length > 0) {
              return prs.data[0].number;
            } else {
              return 0;
            }

      - name: Post Coverage Comment
        if: steps.find-pr.outputs.result != 0
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ steps.find-pr.outputs.result }}
          path: coverage-summary.md
          header: coverage-report
          recreate: true
